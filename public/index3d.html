<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D FPS - Ultimate Battle Arena</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #fff;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        #gameContainer {
            width: 100vw;
            height: 100vh;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 30px;
            height: 30px;
            border: 2px solid #00ff00;
            border-radius: 50%;
            pointer-events: none;
            z-index: 50;
            box-shadow: 0 0 10px #00ff00;
        }

        #crosshair::before,
        #crosshair::after {
            content: '';
            position: absolute;
            background: #00ff00;
        }

        #crosshair::before {
            width: 20px;
            height: 2px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        #crosshair::after {
            width: 2px;
            height: 20px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* HUD Paneli */
        #hudContainer {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 280px;
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #00ff00;
            border-radius: 5px;
            padding: 12px;
            z-index: 100;
            font-size: 13px;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
        }

        .hud-section {
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #00ff00;
        }

        .hud-section:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .hud-row {
            display: flex;
            justify-content: space-between;
            margin: 5px 0;
            align-items: center;
        }

        .hud-label {
            color: #888;
        }

        .hud-value {
            color: #00ff00;
            font-weight: bold;
            font-size: 14px;
        }

        .health-bar {
            width: 100%;
            height: 6px;
            background: #333;
            border: 1px solid #00ff00;
            margin-top: 3px;
            border-radius: 2px;
            overflow: hidden;
        }

        .health-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ff00, #ffff00);
            width: 100%;
            transition: width 0.2s;
        }

        .armor-bar {
            width: 100%;
            height: 4px;
            background: #333;
            border: 1px solid #00ffff;
            margin-top: 2px;
            border-radius: 2px;
            overflow: hidden;
        }

        .armor-bar-fill {
            height: 100%;
            background: #00ffff;
            width: 0%;
            transition: width 0.2s;
        }

        .ammo-section {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }

        .ammo-display {
            flex: 1;
            text-align: center;
            background: rgba(255, 255, 0, 0.1);
            border: 1px solid #ffff00;
            padding: 4px;
            border-radius: 3px;
        }

        .ammo-display small {
            color: #888;
            display: block;
            font-size: 11px;
        }

        .ammo-display .ammo-count {
            color: #ffff00;
            font-weight: bold;
            font-size: 12px;
        }

        .killstreak {
            text-align: center;
            padding: 8px;
            background: rgba(255, 0, 0, 0.2);
            border: 2px solid #ff0000;
            border-radius: 3px;
            color: #ff0000;
            font-weight: bold;
            animation: pulse 0.6s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        /* Silah Paneli */
        #weaponPanel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #ffff00;
            border-radius: 5px;
            padding: 12px;
            z-index: 100;
            box-shadow: 0 0 15px rgba(255, 255, 0, 0.3);
        }

        .weapon-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .weapon-button {
            padding: 8px;
            background: #333;
            border: 2px solid #666;
            color: #fff;
            cursor: pointer;
            border-radius: 3px;
            font-weight: bold;
            font-size: 11px;
            transition: all 0.2s;
            text-align: center;
        }

        .weapon-button:hover {
            background: #555;
            border-color: #00ff00;
        }

        .weapon-button.active {
            background: #00ff00;
            color: #000;
            border-color: #00ff00;
            box-shadow: 0 0 10px #00ff00;
        }

        .weapon-button.noammo {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Leaderboard */
        #leaderboard {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #ff0000;
            border-radius: 5px;
            padding: 12px;
            min-width: 240px;
            max-width: 280px;
            z-index: 100;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.3);
        }

        #leaderboard-title {
            color: #ff0000;
            font-weight: bold;
            margin-bottom: 8px;
            text-align: center;
            font-size: 14px;
        }

        .leaderboard-entry {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid #444;
            font-size: 12px;
        }

        .leaderboard-entry:last-child {
            border-bottom: none;
        }

        .leaderboard-rank {
            color: #888;
            min-width: 20px;
        }

        .leaderboard-name {
            flex: 1;
            color: #00ff00;
            margin: 0 5px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .leaderboard-kills {
            color: #ff0000;
            font-weight: bold;
            text-align: right;
            min-width: 40px;
        }

        /* Mini Map */
        #minimap {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 150px;
            height: 150px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #00ffff;
            border-radius: 3px;
            z-index: 100;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
        }

        /* Ölüm Ekranı */
        #deathScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
        }

        #deathScreen.show {
            display: flex;
        }

        #deathScreen h1 {
            font-size: 72px;
            color: #ff0000;
            margin-bottom: 20px;
            text-shadow: 0 0 20px #ff0000;
        }

        #deathScreen p {
            font-size: 18px;
            color: #fff;
            margin: 5px 0;
        }

        .kill-info {
            color: #ffff00;
            font-weight: bold;
        }

        #respawnTimer {
            font-size: 32px;
            color: #ff0000;
            margin-top: 20px;
            font-weight: bold;
        }

        /* Bildiri */
        #notification {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #ffff00;
            padding: 20px 30px;
            border-radius: 5px;
            font-size: 20px;
            color: #ffff00;
            font-weight: bold;
            display: none;
            z-index: 150;
            animation: fadeInOut 3s;
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0; }
            20%, 80% { opacity: 1; }
        }

        #notification.show {
            display: block;
        }
    </style>
</head>
<body>
    <div id="gameContainer"></div>
    <div id="crosshair"></div>

    <!-- HUD -->
    <div id="hudContainer">
        <div class="hud-section">
            <div class="hud-row">
                <span class="hud-label">❤️ Sağlık</span>
                <span class="hud-value" id="health">100</span>
            </div>
            <div class="health-bar">
                <div class="health-bar-fill" id="healthBar" style="width: 100%"></div>
            </div>
            <div class="armor-bar">
                <div class="armor-bar-fill" id="armorBar" style="width: 0%"></div>
            </div>
        </div>

        <div class="hud-section">
            <div class="hud-row">
                <span class="hud-label">💀 Kill/Death</span>
                <span class="hud-value" id="kd">0/0</span>
            </div>
            <div id="killStreakDiv" style="display: none;">
                <div class="killstreak" id="killstreak">KILL STREAK: 0</div>
            </div>
        </div>

        <div class="hud-section">
            <div class="hud-row">
                <span class="hud-label">🎯 Aktif Silah</span>
                <span class="hud-value" id="weaponName">Pistol</span>
            </div>
            <div class="ammo-section">
                <div class="ammo-display">
                    <small>Mermi</small>
                    <div class="ammo-count" id="ammoCount">120</div>
                </div>
                <div class="ammo-display">
                    <small>Oyuncular</small>
                    <div class="ammo-count" id="playerCount">0</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Silah Paneli -->
    <div id="weaponPanel">
        <div style="color: #ffff00; font-weight: bold; margin-bottom: 8px; font-size: 12px;">⚔️ SİLAH SEC</div>
        <div class="weapon-list" id="weaponButtons"></div>
    </div>

    <!-- Leaderboard -->
    <div id="leaderboard">
        <div id="leaderboard-title">🏆 SıRALAMA</div>
        <div id="leaderboardList"></div>
    </div>

    <!-- Mini Map -->
    <canvas id="minimap"></canvas>

    <!-- Ölüm Ekranı -->
    <div id="deathScreen">
        <h1>☠️ ÖLDÜN!</h1>
        <p id="killMessage">Bilinmeyen tarafından öldürüldün</p>
        <div id="respawnTimer">Yeniden bağlanacaksın: 3</div>
    </div>

    <!-- Bildirim -->
    <div id="notification"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Three.js Ortamı
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.Fog(0x87ceeb, 3000, 8000);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 10000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFShadowShadowMap;
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('gameContainer').appendChild(renderer.domElement);

        // Işıklandırma
        const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
        sunLight.position.set(4000, 1500, 4000);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 4096;
        sunLight.shadow.mapSize.height = 4096;
        sunLight.shadow.camera.left = -8000;
        sunLight.shadow.camera.right = 8000;
        sunLight.shadow.camera.top = 8000;
        sunLight.shadow.camera.bottom = -8000;
        sunLight.shadow.camera.far = 10000;
        scene.add(sunLight);

        const ambientLight = new THREE.AmbientLight(0xc0c0c0);
        scene.add(ambientLight);

        // Oyun Veri
        let gameState = {
            playerId: null,
            players: {},
            playerMeshes: {},
            bullets: [],
            bulletMeshes: {},
            explosions: [],
            items: [],
            worldWidth: 8000,
            worldDepth: 8000,
            weapons: {}
        };

        const keys = {};
        let ws = null;
        let playerMesh = null;
        let isAlive = true;

        // Harita Oluştur
        function createMap() {
            // Zemin
            const groundGeometry = new THREE.PlaneGeometry(8000, 8000);
            const groundMaterial = new THREE.MeshLambertMaterial({ color: 0x228b22 });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // Harita ortasında arena iŞareti
            const arenaGeometry = new THREE.PlaneGeometry(1000, 1000);
            const arenaMaterial = new THREE.MeshLambertMaterial({ color: 0xff6600, emissive: 0xff6600 });
            const arena = new THREE.Mesh(arenaGeometry, arenaMaterial);
            arena.position.set(4000, 0.1, 4000);
            arena.rotation.x = -Math.PI / 2;
            scene.add(arena);

            // Binalar
            const colors = [0xff0000, 0x0000ff, 0xffff00, 0xff00ff, 0x00ffff, 0xff6600];
            for (let i = 0; i < 20; i++) {
                const width = 200 + Math.random() * 300;
                const height = 300 + Math.random() * 400;
                const depth = 200 + Math.random() * 300;

                const buildingGeometry = new THREE.BoxGeometry(width, height, depth);
                const buildingMaterial = new THREE.MeshPhongMaterial({
                    color: colors[Math.floor(Math.random() * colors.length)],
                    shininess: 30
                });
                const building = new THREE.Mesh(buildingGeometry, buildingMaterial);
                building.position.set(
                    Math.random() * 7000 + 500,
                    height / 2,
                    Math.random() * 7000 + 500
                );
                building.castShadow = true;
                building.receiveShadow = true;
                scene.add(building);
            }

            // Duvar
            const wallGeometry = new THREE.BoxGeometry(8000, 500, 50);
            const wallMaterial = new THREE.MeshPhongMaterial({ color: 0x8b8b8b });
            const walls = [
                { x: 4000, y: 250, z: 0 },
                { x: 4000, y: 250, z: 8000 },
                { x: 0, y: 250, z: 4000 },
                { x: 8000, y: 250, z: 4000 }
            ];
            walls.forEach(pos => {
                const wall = new THREE.Mesh(wallGeometry, wallMaterial);
                wall.position.set(pos.x, pos.y, pos.z);
                wall.castShadow = true;
                wall.receiveShadow = true;
                scene.add(wall);
            });
        }

        createMap();

        // WebSocket Bağlantısı
        function connect() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}`);

            ws.onopen = () => {
                console.log('🟢 Sunucuya bağlandı!');
            };

            ws.onmessage = (event) => {
                const message = JSON.parse(event.data);

                if (message.type === 'init') {
                    gameState.playerId = message.playerId;
                    gameState.worldWidth = message.worldWidth;
                    gameState.worldDepth = message.worldDepth;
                    gameState.weapons = message.weapons;
                    gameState.items = message.items;
                    setupWeaponButtons();
                    createPlayerMesh();
                }

                if (message.type === 'gameState') {
                    gameState.players = {};
                    message.players.forEach(player => {
                        gameState.players[player.id] = player;
                    });
                    gameState.bullets = message.bullets;
                    gameState.explosions = message.explosions || [];
                    gameState.items = message.items || [];
                }
            };

            ws.onclose = () => {
                console.log('🔄 Yeniden bağlanılıyor...');
                setTimeout(connect, 2000);
            };
        }

        function setupWeaponButtons() {
            const container = document.getElementById('weaponButtons');
            const sortedWeapons = Object.values(gameState.weapons).sort((a, b) => a.id - b.id);
            sortedWeapons.forEach(weapon => {
                const button = document.createElement('button');
                button.className = 'weapon-button';
                if (weapon.id === 1) button.classList.add('active');
                button.textContent = `${weapon.id}. ${weapon.name.substring(0, 8)}`;
                button.onclick = () => switchWeapon(weapon.id);
                container.appendChild(button);
            });
        }

        function switchWeapon(weaponId) {
            if (ws && gameState.playerId !== null) {
                const player = gameState.players[gameState.playerId];
                if (player && player.ammunition[weaponId] > 0) {
                    ws.send(JSON.stringify({
                        type: 'changeWeapon',
                        weaponId: weaponId
                    }));

                    document.querySelectorAll('.weapon-button').forEach((btn, idx) => {
                        btn.classList.remove('active');
                    });
                    document.querySelector(`.weapon-button:nth-child(${Object.values(gameState.weapons).filter(w => w.id <= weaponId).length})`).classList.add('active');
                }
            }
        }

        function createPlayerMesh() {
            const geometry = new THREE.CapsuleGeometry(0.8, 2, 4, 8);
            const material = new THREE.MeshPhongMaterial({ color: 0x00ff00, emissive: 0x00ff00 });
            playerMesh = new THREE.Mesh(geometry, material);
            playerMesh.castShadow = true;
            playerMesh.receiveShadow = true;
            scene.add(playerMesh);
        }

        function showNotification(text) {
            const notif = document.getElementById('notification');
            notif.textContent = text;
            notif.classList.add('show');
            setTimeout(() => notif.classList.remove('show'), 3000);
        }

        connect();

        // Giriş Kontrolü
        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            keys[key] = true;

            if (['1', '2', '3', '4', '5'].includes(key)) {
                switchWeapon(parseInt(key));
            }
        });

        window.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });

        let mouseX = 0, mouseY = 0;
        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth) * 2 - 1;
            mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
        });

        window.addEventListener('click', () => {
            if (ws && gameState.playerId !== null && isAlive) {
                const player = gameState.players[gameState.playerId];
                if (player && player.alive) {
                    ws.send(JSON.stringify({
                        type: 'shoot',
                        angle: player.angle,
                        pitch: player.pitch,
                        weaponId: player.currentWeapon
                    }));
                }
            }
        });

        // Oyun Döngüsü
        setInterval(() => {
            if (ws && gameState.playerId !== null) {
                const player = gameState.players[gameState.playerId];
                if (player && player.alive) {
                    let x = player.x;
                    let y = player.y;
                    let z = player.z;

                    const moveSpeed = 0.6;
                    if (keys['w']) z -= moveSpeed;
                    if (keys['s']) z += moveSpeed;
                    if (keys['a']) x -= moveSpeed;
                    if (keys['d']) x += moveSpeed;

                    const angle = Math.atan2(mouseX, mouseY);
                    const pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, Math.asin(mouseY)));

                    ws.send(JSON.stringify({
                        type: 'move',
                        x: x,
                        y: y,
                        z: z,
                        angle: angle,
                        pitch: pitch
                    }));
                }
            }
        }, 1000 / 60);

        // Render
        function animate() {
            requestAnimationFrame(animate);

            const player = gameState.players[gameState.playerId];

            if (player) {
                // Kamera
                camera.position.x = player.x;
                camera.position.y = player.y + 8;
                camera.position.z = player.z;

                camera.rotation.order = 'YXZ';
                camera.rotation.y = player.angle + Math.PI / 2;
                camera.rotation.x = player.pitch;

                // HUD Güncelleme
                document.getElementById('health').textContent = Math.max(0, Math.floor(player.health));
                document.getElementById('healthBar').style.width = `${(player.health / player.maxHealth) * 100}%`;
                document.getElementById('armorBar').style.width = `${(player.armor / 100) * 100}%`;
                document.getElementById('kd').textContent = `${player.kills}/${player.deaths}`;
                document.getElementById('playerCount').textContent = Object.keys(gameState.players).length;

                const weapon = Object.values(gameState.weapons).find(w => w.id === player.currentWeapon);
                if (weapon) {
                    document.getElementById('weaponName').textContent = weapon.name;
                    document.getElementById('ammoCount').textContent = player.ammunition[weapon.id] || 0;
                }

                // Kill Streak
                if (player.killStreak > 0) {
                    const killStreakDiv = document.getElementById('killStreakDiv');
                    killStreakDiv.style.display = 'block';
                    document.getElementById('killstreak').textContent = `🔥 KILL STREAK: ${player.killStreak}`;
                    if (player.killStreak > 5) {
                        document.getElementById('killstreak').style.background = 'rgba(255, 0, 0, 0.3)';
                        document.getElementById('killstreak').style.color = '#ff0000';
                    }
                } else {
                    document.getElementById('killStreakDiv').style.display = 'none';
                }

                // Ölüm Durumu
                if (!player.alive && isAlive) {
                    isAlive = false;
                    document.getElementById('deathScreen').classList.add('show');
                    let respawnTime = 3;
                    const timer = setInterval(() => {
                        respawnTime--;
                        document.getElementById('respawnTimer').textContent = `Yeniden bağlanacaksın: ${respawnTime}`;
                        if (respawnTime <= 0) {
                            clearInterval(timer);
                        }
                    }, 1000);
                } else if (player.alive && !isAlive) {
                    isAlive = true;
                    document.getElementById('deathScreen').classList.remove('show');
                }

                // Sıralama
                const sorted = Object.values(gameState.players)
                    .sort((a, b) => b.kills - a.kills)
                    .slice(0, 8);
                const leaderboardList = document.getElementById('leaderboardList');
                leaderboardList.innerHTML = sorted
                    .map((p, i) => `<div class="leaderboard-entry">
                        <span class="leaderboard-rank">#${i + 1}</span>
                        <span class="leaderboard-name">${p.name}</span>
                        <span class="leaderboard-kills">${p.kills}</span>
                    </div>`)
                    .join('');
            }

            // Oyuncu Meshleri
            Object.entries(gameState.players).forEach(([id, p]) => {
                if (id === gameState.playerId.toString()) return;

                if (!gameState.playerMeshes[id] && p.alive) {
                    const geometry = new THREE.CapsuleGeometry(0.8, 2, 4, 8);
                    const material = new THREE.MeshPhongMaterial({
                        color: 0xff0000,
                        emissive: 0x330000
                    });
                    const mesh = new THREE.Mesh(geometry, material);
                    mesh.castShadow = true;
                    mesh.receiveShadow = true;
                    scene.add(mesh);
                    gameState.playerMeshes[id] = mesh;
                } else if (gameState.playerMeshes[id]) {
                    const mesh = gameState.playerMeshes[id];
                    mesh.position.set(p.x, p.y, p.z);
                    if (!p.alive) {
                        scene.remove(mesh);
                        delete gameState.playerMeshes[id];
                    }
                }
            });

            // Mermiler
            gameState.bullets.forEach((bullet) => {
                let mesh = gameState.bulletMeshes[bullet.id];
                if (!mesh) {
                    const geometry = new THREE.SphereGeometry(0.4, 8, 8);
                    const color = bullet.color === '#ffff00' ? 0xffff00 :
                                  bullet.color === '#00ff00' ? 0x00ff00 :
                                  bullet.color === '#ffffff' ? 0xffffff :
                                  bullet.color === '#ff00ff' ? 0xff00ff : 0x000000;
                    const material = new THREE.MeshPhongMaterial({
                        color: color,
                        emissive: color,
                        shininess: 100
                    });
                    mesh = new THREE.Mesh(geometry, material);
                    scene.add(mesh);
                    gameState.bulletMeshes[bullet.id] = mesh;
                }
                mesh.position.set(bullet.x, bullet.y, bullet.z);
            });

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
