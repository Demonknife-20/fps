<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D FPS - Oyun</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        #gameContainer {
            width: 100vw;
            height: 100vh;
        }

        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 5px;
            font-size: 13px;
            z-index: 100;
            border: 2px solid #00ff00;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 30px;
            height: 30px;
            border: 2px solid #00ff00;
            border-radius: 50%;
            pointer-events: none;
            z-index: 50;
        }

        #crosshair::before,
        #crosshair::after {
            content: '';
            position: absolute;
            background: #00ff00;
        }

        #crosshair::before {
            width: 20px;
            height: 2px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        #crosshair::after {
            width: 2px;
            height: 20px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        #weaponHUD {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 5px;
            z-index: 100;
            border: 2px solid #ffff00;
            min-width: 200px;
        }

        .weapon-button {
            display: inline-block;
            padding: 8px 12px;
            margin: 5px 5px 5px 0;
            background: #333;
            border: 2px solid #666;
            color: #fff;
            cursor: pointer;
            border-radius: 3px;
            font-weight: bold;
            transition: all 0.2s;
        }

        .weapon-button:hover {
            background: #555;
            border-color: #00ff00;
        }

        .weapon-button.active {
            background: #00ff00;
            color: #000;
            border-color: #00ff00;
        }

        #leaderboard {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 5px;
            font-size: 12px;
            max-width: 220px;
            z-index: 100;
            border: 2px solid #ff0000;
        }

        .stat {
            margin: 8px 0;
            padding: 5px 0;
            border-bottom: 1px solid #333;
        }

        .stat:last-child {
            border-bottom: none;
        }

        .stat-label {
            color: #888;
            display: inline-block;
            width: 80px;
        }

        .stat-value {
            color: #0f0;
            font-weight: bold;
        }

        #status {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
            border: 2px solid #ffff00;
        }
    </style>
</head>
<body>
    <div id="gameContainer"></div>
    <div id="crosshair"></div>

    <div id="hud">
        <div class="stat">
            <span class="stat-label">❤️ Sağlık:</span>
            <span class="stat-value" id="health">100</span>
        </div>
        <div class="stat">
            <span class="stat-label">💀 Öldürme:</span>
            <span class="stat-value" id="kills">0</span>
        </div>
        <div class="stat">
            <span class="stat-label">⚰️ Ölüm:</span>
            <span class="stat-value" id="deaths">0</span>
        </div>
        <div class="stat">
            <span class="stat-label">🎮 Silah:</span>
            <span class="stat-value" id="weaponName">Pistol</span>
        </div>
    </div>

    <div id="weaponHUD">
        <div style="color: #ffff00; font-weight: bold; margin-bottom: 8px;">⚔️ Silah (1-4):</div>
        <div id="weaponButtons"></div>
    </div>

    <div id="leaderboard">
        <strong style="color: #f00;">🏆 Sıralama</strong>
        <div id="leaderboardList"></div>
    </div>

    <div id="status">
        <span id="statusText">🔌 Bağlanılıyor...</span>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Three.js ortamı
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.Fog(0x87ceeb, 2000, 5000);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 5000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.getElementById('gameContainer').appendChild(renderer.domElement);

        // Işık
        const sunLight = new THREE.DirectionalLight(0xffffff, 1);
        sunLight.position.set(2500, 1000, 2500);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.left = -5000;
        sunLight.shadow.camera.right = 5000;
        sunLight.shadow.camera.top = 5000;
        sunLight.shadow.camera.bottom = -5000;
        scene.add(sunLight);

        const ambientLight = new THREE.AmbientLight(0x808080);
        scene.add(ambientLight);

        // Oyun değişkenleri
        let gameState = {
            playerId: null,
            players: {},
            playerMeshes: {},
            bullets: [],
            bulletMeshes: {},
            explosions: [],
            worldWidth: 5000,
            worldDepth: 5000,
            weapons: {}
        };

        const keys = {};
        let ws = null;
        let playerMesh = null;

        // Harita oluştur
        function createMap() {
            // Zemin
            const groundGeometry = new THREE.PlaneGeometry(5000, 5000);
            const groundMaterial = new THREE.MeshLambertMaterial({ color: 0x90EE90 });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // Binalar (dekoratif)
            for (let i = 0; i < 8; i++) {
                const buildingGeometry = new THREE.BoxGeometry(
                    200 + Math.random() * 200,
                    300 + Math.random() * 200,
                    200 + Math.random() * 200
                );
                const buildingMaterial = new THREE.MeshLambertMaterial({
                    color: Math.random() * 0xffffff
                });
                const building = new THREE.Mesh(buildingGeometry, buildingMaterial);
                building.position.set(
                    Math.random() * 4500 + 250,
                    (300 + Math.random() * 200) / 2,
                    Math.random() * 4500 + 250
                );
                building.castShadow = true;
                building.receiveShadow = true;
                scene.add(building);
            }
        }

        createMap();

        // WebSocket
        function connect() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}`);

            ws.onopen = () => {
                document.getElementById('statusText').textContent = '🟢 Bağlandı';
            };

            ws.onmessage = (event) => {
                const message = JSON.parse(event.data);

                if (message.type === 'init') {
                    gameState.playerId = message.playerId;
                    gameState.worldWidth = message.worldWidth;
                    gameState.worldDepth = message.worldDepth;
                    gameState.weapons = message.weapons;
                    setupWeaponButtons();
                    createPlayerMesh();
                }

                if (message.type === 'gameState') {
                    gameState.players = {};
                    message.players.forEach(player => {
                        gameState.players[player.id] = player;
                    });
                    gameState.bullets = message.bullets;
                    gameState.explosions = message.explosions || [];
                }
            };

            ws.onerror = () => {
                document.getElementById('statusText').textContent = '❌ Hata';
            };

            ws.onclose = () => {
                document.getElementById('statusText').textContent = '⏳ Yeniden bağlanılıyor...';
                setTimeout(connect, 3000);
            };
        }

        function setupWeaponButtons() {
            const container = document.getElementById('weaponButtons');
            Object.values(gameState.weapons).forEach(weapon => {
                const button = document.createElement('button');
                button.className = 'weapon-button';
                if (weapon.id === 1) button.classList.add('active');
                button.textContent = `${weapon.id}. ${weapon.name}`;
                button.onclick = () => switchWeapon(weapon.id);
                container.appendChild(button);
            });
        }

        function switchWeapon(weaponId) {
            if (ws) {
                ws.send(JSON.stringify({
                    type: 'changeWeapon',
                    weaponId: weaponId
                }));

                document.querySelectorAll('.weapon-button').forEach(btn => {
                    btn.classList.remove('active');
                });
                document.querySelector(`.weapon-button:nth-child(${weaponId})`).classList.add('active');
            }
        }

        function createPlayerMesh() {
            const geometry = new THREE.BoxGeometry(1, 2, 1);
            const material = new THREE.MeshPhongMaterial({ color: 0x00ff00 });
            playerMesh = new THREE.Mesh(geometry, material);
            playerMesh.castShadow = true;
            playerMesh.receiveShadow = true;
            scene.add(playerMesh);
        }

        connect();

        // Giriş
        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            keys[key] = true;

            if (['1', '2', '3', '4'].includes(key)) {
                switchWeapon(parseInt(key));
            }
        });

        window.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });

        let mouseX = 0, mouseY = 0;
        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth) * 2 - 1;
            mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
        });

        window.addEventListener('click', () => {
            if (ws && gameState.playerId !== null) {
                const player = gameState.players[gameState.playerId];
                if (player && player.alive) {
                    ws.send(JSON.stringify({
                        type: 'shoot',
                        angle: player.angle,
                        pitch: player.pitch,
                        weaponId: player.currentWeapon
                    }));
                }
            }
        });

        // Oyun döngüsü
        setInterval(() => {
            if (ws && gameState.playerId !== null) {
                const player = gameState.players[gameState.playerId];
                if (player && player.alive) {
                    let x = player.x;
                    let y = player.y;
                    let z = player.z;

                    const moveSpeed = 0.5;
                    if (keys['w']) z -= moveSpeed;
                    if (keys['s']) z += moveSpeed;
                    if (keys['a']) x -= moveSpeed;
                    if (keys['d']) x += moveSpeed;

                    const angle = Math.atan2(mouseX, mouseY);
                    const pitch = Math.asin(mouseY);

                    ws.send(JSON.stringify({
                        type: 'move',
                        x: x,
                        y: y,
                        z: z,
                        angle: angle,
                        pitch: pitch
                    }));
                }
            }
        }, 1000 / 60);

        // Render döngüsü
        function animate() {
            requestAnimationFrame(animate);

            const player = gameState.players[gameState.playerId];

            if (player && player.alive) {
                // Kamera pozisyonu
                camera.position.x = player.x;
                camera.position.y = player.y + 8;
                camera.position.z = player.z;

                // Kamera rotasyonu
                const angle = player.angle;
                const pitch = player.pitch;
                camera.rotation.order = 'YXZ';
                camera.rotation.y = angle + Math.PI / 2;
                camera.rotation.x = pitch;
            }

            // Oyuncuları güncelle
            Object.entries(gameState.players).forEach(([id, p]) => {
                if (id === gameState.playerId.toString()) return;

                if (!gameState.playerMeshes[id] && p.alive) {
                    const geometry = new THREE.BoxGeometry(1, 2, 1);
                    const material = new THREE.MeshPhongMaterial({
                        color: 0xff0000
                    });
                    const mesh = new THREE.Mesh(geometry, material);
                    mesh.castShadow = true;
                    mesh.receiveShadow = true;
                    scene.add(mesh);
                    gameState.playerMeshes[id] = mesh;
                } else if (gameState.playerMeshes[id]) {
                    const mesh = gameState.playerMeshes[id];
                    mesh.position.set(p.x, p.y, p.z);
                    if (!p.alive) {
                        scene.remove(mesh);
                        delete gameState.playerMeshes[id];
                    }
                }
            });

            // Mermileri güncelle
            gameState.bullets.forEach((bullet) => {
                let mesh = gameState.bulletMeshes[bullet.id];
                if (!mesh) {
                    const geometry = new THREE.SphereGeometry(0.5, 8, 8);
                    const material = new THREE.MeshPhongMaterial({
                        color: bullet.color === '#ffff00' ? 0xffff00 : 
                               bullet.color === '#00ff00' ? 0x00ff00 : 
                               bullet.color === '#ffffff' ? 0xffffff : 0x000000
                    });
                    mesh = new THREE.Mesh(geometry, material);
                    scene.add(mesh);
                    gameState.bulletMeshes[bullet.id] = mesh;
                }
                mesh.position.set(bullet.x, bullet.y, bullet.z);
            });

            // Patlamaları güncelle
            gameState.explosions.forEach((exp) => {
                // Patlama efekti eklenebilir
            });

            // HUD güncelleme
            if (player) {
                document.getElementById('health').textContent = Math.max(0, Math.floor(player.health));
                document.getElementById('kills').textContent = player.kills;
                document.getElementById('deaths').textContent = player.deaths;

                const weaponName = Object.values(gameState.weapons).find(w => w.id === player.currentWeapon)?.name || 'Unknown';
                document.getElementById('weaponName').textContent = weaponName;

                // Sıralama
                const sorted = Object.values(gameState.players)
                    .sort((a, b) => b.kills - a.kills)
                    .slice(0, 5);
                const leaderboardList = document.getElementById('leaderboardList');
                leaderboardList.innerHTML = sorted
                    .map((p, i) => `<div style="padding: 5px 0; border-bottom: 1px solid #444;">
                        ${i + 1}. <span style="color: #0f0;">${p.name}</span> 
                        <span style="color: #f00; font-weight: bold;">${p.kills}</span>
                    </div>`)
                    .join('');
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
