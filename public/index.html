<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FPS - Poxel.io Tarzı Oyun</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a1a;
            color: #fff;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        #gameContainer {
            display: flex;
            height: 100vh;
        }

        canvas {
            flex: 1;
            background: #0a0a0a;
            cursor: crosshair;
        }

        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 5px;
            font-size: 13px;
            z-index: 100;
            border: 2px solid #00ff00;
        }

        #weaponHUD {
            position: absolute;
            bottom: 100px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 5px;
            z-index: 100;
            border: 2px solid #ffff00;
            min-width: 200px;
        }

        .weapon-button {
            display: inline-block;
            padding: 8px 12px;
            margin: 5px 5px 5px 0;
            background: #333;
            border: 2px solid #666;
            color: #fff;
            cursor: pointer;
            border-radius: 3px;
            font-weight: bold;
            transition: all 0.2s;
        }

        .weapon-button:hover {
            background: #555;
            border-color: #00ff00;
        }

        .weapon-button.active {
            background: #00ff00;
            color: #000;
            border-color: #00ff00;
        }

        #leaderboard {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 5px;
            font-size: 12px;
            max-width: 220px;
            z-index: 100;
            border: 2px solid #ff0000;
        }

        .stat {
            margin: 8px 0;
            padding: 5px 0;
            border-bottom: 1px solid #333;
        }

        .stat:last-child {
            border-bottom: none;
        }

        .stat-label {
            color: #888;
            display: inline-block;
            width: 80px;
        }

        .stat-value {
            color: #0f0;
            font-weight: bold;
        }

        .leaderboard-item {
            padding: 5px 0;
            border-bottom: 1px solid #444;
            display: flex;
            justify-content: space-between;
        }

        .leaderboard-item:last-child {
            border-bottom: none;
        }

        .player-name {
            color: #0f0;
            flex: 1;
        }

        .player-kills {
            color: #f00;
            font-weight: bold;
            min-width: 30px;
            text-align: right;
        }

        #status {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
            border: 2px solid #ffff00;
        }

        .connecting {
            color: #ff0;
        }

        .connected {
            color: #0f0;
        }

        .dead {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(0, 0, 0, 0.95);
            padding: 40px;
            border-radius: 10px;
            z-index: 200;
            border: 3px solid #ff0000;
        }

        .dead h1 {
            color: #f00;
            font-size: 48px;
            margin-bottom: 15px;
        }

        .dead p {
            color: #fff;
            font-size: 16px;
            margin: 5px 0;
        }

        #instructionHUD {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 12px;
            border-radius: 5px;
            font-size: 11px;
            max-width: 150px;
            z-index: 100;
            border: 1px solid #666;
        }

        .instruction {
            margin: 3px 0;
            color: #ccc;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
    </div>

    <div id="hud">
        <div class="stat">
            <span class="stat-label">❤️ Sağlık:</span>
            <span class="stat-value" id="health">100</span>
        </div>
        <div class="stat">
            <span class="stat-label">💀 Öldürme:</span>
            <span class="stat-value" id="kills">0</span>
        </div>
        <div class="stat">
            <span class="stat-label">⚰️ Ölüm:</span>
            <span class="stat-value" id="deaths">0</span>
        </div>
        <div class="stat">
            <span class="stat-label">👥 Oyuncu:</span>
            <span class="stat-value" id="playerCount">0</span>
        </div>
        <div class="stat">
            <span class="stat-label">🎯 Silah:</span>
            <span class="stat-value" id="weaponName">Pistol</span>
        </div>
    </div>

    <div id="weaponHUD">
        <div style="color: #ffff00; font-weight: bold; margin-bottom: 8px;">⚔️ Silah Seç (1-4):</div>
        <div id="weaponButtons"></div>
    </div>

    <div id="leaderboard">
        <strong style="color: #f00;">🏆 Sıralama</strong>
        <div id="leaderboardList"></div>
    </div>

    <div id="status">
        <span class="connecting">⚫</span> <span id="statusText">Bağlanılıyor...</span>
    </div>

    <div id="instructionHUD">
        <div class="instruction"><strong>⌨️ Kontroller</strong></div>
        <div class="instruction">W/A/S/D - Hareket</div>
        <div class="instruction">Fare - Nişan</div>
        <div class="instruction">Sol Tık - Ateş</div>
        <div class="instruction">1-4 / Buton - Silah</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let gameState = {
            playerId: null,
            players: {},
            bullets: [],
            explosions: [],
            worldWidth: 5000,
            worldHeight: 5000,
            cameraX: 0,
            cameraY: 0,
            mouseX: canvas.width / 2,
            mouseY: canvas.height / 2,
            weapons: {}
        };

        const keys = {};
        let ws = null;

        // WebSocket bağlantısı
        function connect() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}`);

            ws.onopen = () => {
                console.log('✅ Sunucuya bağlandı!');
                document.getElementById('statusText').textContent = 'Bağlandı';
                document.querySelector('#status .connecting').classList.add('connected');
                document.querySelector('#status .connecting').classList.remove('connecting');
                document.querySelector('#status .connecting').textContent = '🟢';
            };

            ws.onmessage = (event) => {
                const message = JSON.parse(event.data);

                if (message.type === 'init') {
                    gameState.playerId = message.playerId;
                    gameState.worldWidth = message.worldWidth;
                    gameState.worldHeight = message.worldHeight;
                    gameState.weapons = message.weapons;
                    console.log('🎮 Oyun ID:', message.playerId);
                    setupWeaponButtons();
                }

                if (message.type === 'gameState') {
                    gameState.players = {};
                    message.players.forEach(player => {
                        gameState.players[player.id] = player;
                    });
                    gameState.bullets = message.bullets;
                    gameState.explosions = message.explosions || [];
                }
            };

            ws.onerror = (error) => {
                console.error('❌ WebSocket hatası:', error);
                document.getElementById('statusText').textContent = 'Hata';
            };

            ws.onclose = () => {
                console.log('🔄 Yeniden bağlanılıyor...');
                document.getElementById('statusText').textContent = 'Bağlanılıyor...';
                setTimeout(connect, 3000);
            };
        }

        function setupWeaponButtons() {
            const container = document.getElementById('weaponButtons');
            Object.values(gameState.weapons).forEach(weapon => {
                const button = document.createElement('button');
                button.className = 'weapon-button';
                if (weapon.id === 1) button.classList.add('active');
                button.textContent = `${weapon.id}. ${weapon.name}`;
                button.onclick = () => switchWeapon(weapon.id);
                container.appendChild(button);
            });
        }

        function switchWeapon(weaponId) {
            if (ws && gameState.playerId !== null) {
                const player = gameState.players[gameState.playerId];
                if (player) {
                    ws.send(JSON.stringify({
                        type: 'changeWeapon',
                        weaponId: weaponId
                    }));

                    // UI güncelle
                    document.querySelectorAll('.weapon-button').forEach(btn => {
                        btn.classList.remove('active');
                    });
                    document.querySelector(`.weapon-button:nth-child(${weaponId})`).classList.add('active');
                }
            }
        }

        connect();

        // Giriş kontrolü
        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            keys[key] = true;

            // Silah değiştirme
            if (['1', '2', '3', '4'].includes(key)) {
                switchWeapon(parseInt(key));
            }
        });

        window.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });

        window.addEventListener('mousemove', (e) => {
            gameState.mouseX = e.clientX;
            gameState.mouseY = e.clientY;
        });

        window.addEventListener('click', () => {
            if (ws && gameState.playerId !== null) {
                const player = gameState.players[gameState.playerId];
                if (player && player.alive) {
                    const dx = gameState.mouseX - canvas.width / 2;
                    const dy = gameState.mouseY - canvas.height / 2;
                    const angle = Math.atan2(dy, dx);

                    ws.send(JSON.stringify({
                        type: 'shoot',
                        angle: angle,
                        weaponId: player.currentWeapon
                    }));
                }
            }
        });

        // Oyuncu hareketi
        setInterval(() => {
            if (ws && gameState.playerId !== null) {
                const player = gameState.players[gameState.playerId];
                if (player && player.alive) {
                    let x = player.x;
                    let y = player.y;

                    if (keys['w'] || keys['arrowup']) y -= player.speed;
                    if (keys['s'] || keys['arrowdown']) y += player.speed;
                    if (keys['a'] || keys['arrowleft']) x -= player.speed;
                    if (keys['d'] || keys['arrowright']) x += player.speed;

                    const dx = gameState.mouseX - canvas.width / 2;
                    const dy = gameState.mouseY - canvas.height / 2;
                    const angle = Math.atan2(dy, dx);

                    ws.send(JSON.stringify({
                        type: 'move',
                        x: x,
                        y: y,
                        angle: angle
                    }));
                }
            }
        }, 1000 / 60);

        // Çizim
        function draw() {
            const player = gameState.players[gameState.playerId];

            if (player && player.alive) {
                gameState.cameraX = player.x - canvas.width / 2;
                gameState.cameraY = player.y - canvas.height / 2;
            }

            // Arka plan
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Grid
            ctx.strokeStyle = '#1a1a1a';
            ctx.lineWidth = 1;
            const gridSize = 100;
            for (let x = -gameState.cameraX % gridSize; x < canvas.width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = -gameState.cameraY % gridSize; y < canvas.height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }

            // Patlamaları çiz
            gameState.explosions.forEach(explosion => {
                const x = explosion.x - gameState.cameraX;
                const y = explosion.y - gameState.cameraY;
                const alpha = explosion.lifetime / explosion.maxLifetime;
                const radius = explosion.radius * alpha;

                // Patlama çemberi
                ctx.strokeStyle = `rgba(255, 100, 0, ${alpha * 0.7})`;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.stroke();

                // İç doldurma
                ctx.fillStyle = `rgba(255, 150, 0, ${alpha * 0.3})`;
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.fill();
            });

            // Mermileri çiz
            gameState.bullets.forEach(bullet => {
                const x = bullet.x - gameState.cameraX;
                const y = bullet.y - gameState.cameraY;

                if (bullet.isExplosive) {
                    // Bomba - Siyah daire
                    ctx.fillStyle = '#000000';
                    ctx.beginPath();
                    ctx.arc(x, y, 5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#ff6600';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                } else {
                    // Normal mermi
                    ctx.fillStyle = bullet.color;
                    ctx.fillRect(x - 2, y - 2, 4, 4);
                }
            });

            // Oyuncuları çiz
            Object.values(gameState.players).forEach(p => {
                const x = p.x - gameState.cameraX;
                const y = p.y - gameState.cameraY;

                // Oyuncu çerçevesi
                if (p.alive) {
                    ctx.fillStyle = p.id === gameState.playerId ? '#00ff00' : '#ff0000';
                } else {
                    ctx.fillStyle = '#444444';
                }
                ctx.fillRect(x - 15, y - 15, 30, 30);

                // Sağlık çubuğu
                const healthPercent = Math.max(0, p.health / 100);
                ctx.fillStyle = healthPercent > 0.5 ? '#00ff00' : healthPercent > 0.25 ? '#ffff00' : '#ff0000';
                ctx.fillRect(x - 15, y - 22, 30 * healthPercent, 3);
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 1;
                ctx.strokeRect(x - 15, y - 22, 30, 3);

                // Oyuncu ismi ve kill count
                ctx.fillStyle = '#fff';
                ctx.font = '10px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(p.name, x, y + 25);
                ctx.fillStyle = '#ffff00';
                ctx.font = 'bold 8px Arial';
                ctx.fillText(`K:${p.kills} D:${p.deaths}`, x, y + 35);

                // Silah yönü
                if (p.alive) {
                    ctx.strokeStyle = '#00ff00';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(x, y);
                    ctx.lineTo(x + Math.cos(p.angle) * 20, y + Math.sin(p.angle) * 20);
                    ctx.stroke();
                }
            });

            // HUD güncelleme
            if (player) {
                document.getElementById('health').textContent = Math.max(0, Math.floor(player.health));
                document.getElementById('kills').textContent = player.kills;
                document.getElementById('deaths').textContent = player.deaths;
                document.getElementById('playerCount').textContent = Object.keys(gameState.players).length;

                const weaponName = Object.values(gameState.weapons).find(w => w.id === player.currentWeapon)?.name || 'Unknown';
                document.getElementById('weaponName').textContent = weaponName;

                // Sıralama
                const sorted = Object.values(gameState.players)
                    .sort((a, b) => b.kills - a.kills)
                    .slice(0, 5);
                const leaderboardList = document.getElementById('leaderboardList');
                leaderboardList.innerHTML = sorted
                    .map((p, i) => `
                        <div class="leaderboard-item">
                            <span>${i + 1}. <span class="player-name">${p.name}</span></span>
                            <span class="player-kills">${p.kills}</span>
                        </div>
                    `)
                    .join('');

                // Ölüm ekranı
                if (!player.alive) {
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = '#ff0000';
                    ctx.font = 'bold 60px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('ÖLDÜN! 💀', canvas.width / 2, canvas.height / 2 - 50);
                    ctx.fillStyle = '#ffff00';
                    ctx.font = 'bold 24px Arial';
                    ctx.fillText('3 saniye sonra yeniden doğacaksın...', canvas.width / 2, canvas.height / 2 + 50);
                }
            }

            requestAnimationFrame(draw);
        }

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        draw();
    </script>
</body>
</html>
